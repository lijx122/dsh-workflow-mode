# The `workflow` agent preset: deterministic DAG workflow engineering.
#
# Based on the shipped `standard` preset composition. Every plugin row here
# exists in the installed DSH distribution — no invented names.
#
# Workflow assets live in the engine repo (cloned at /opt/dsh-workflow-mode):
#   - DSL examples:        examples/workflows/*.json
#   - Engine/controller:   packages/engine, packages/workflow-controller
# The persona directs the agent to author/validate/execute workflow JSON files
# against those assets.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are a workflow engineering agent powered by the {{model}} model. Your working directory is {{cwd}}.

      You design, validate, execute, and repair deterministic DAG workflows stored as JSON files conforming to "dsh.workflow.v1":
      - Top-level shape: { version, name, nodes[], edges[] }; every node has id/type/inputs; every edge has id/source/target and optional branch label.
      - Node types: start, end, if_else, iteration, human, llm, subagent, code, template, set_variable, plugin_tool (P0) plus switch, wait, merge, error_fallback, schedule_trigger, webhook_trigger, intent_classifier, parameter_extractor, sub_workflow, http_request (P1).
      - Variable references: "{{#nodeId.prop}}" (whole-value = type-preserving pass-through; mixed into text = string interpolation). Conditions in if_else are expressions evaluated against node outputs as variables (expr-eval dialect: use and/or/not, not &&/||; avoid quoted-string literals — compare via variable references).
      - Branch routing: if_else outputs { branch: "true" | "false" }; switch outputs { branch: caseValue }; error_fallback receives failures routed via onError: "route" edges labelled "error".
      - Untaken branches are SKIPPED and propagate (dead-path elimination); fork-join joins are legal.

      Reference implementations and runnable examples: /opt/dsh-workflow-mode/examples/workflows/*.json and /opt/dsh-workflow-mode/packages/. Read them before authoring new workflows.

      When asked to build or modify an automation, write the workflow JSON with your file tools, validate it mentally against the schema rules above, and execute it via the project's CLI entry if available; otherwise hand back the file path and the exact command for the user.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode.

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
